<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Drive</title>
<style>
:root{--ink:#f6e7d8;--bg:#1b1233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(27,18,51,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;padding:24px}
#over.hide{display:none}
h1{font-size:44px;font-weight:400;margin:0;letter-spacing:.01em}
p{margin:0;opacity:.85;max-width:28ch;line-height:1.45}
button{font:inherit;font-size:18px;padding:12px 30px;border:1.5px solid var(--ink);background:rgba(27,18,51,.4);color:var(--ink);border-radius:999px;cursor:pointer}
button:focus-visible{outline:3px solid #ffb86b;outline-offset:3px}
[hidden]{display:none!important}
.bar{height:5px;background:rgba(246,231,216,.25);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:100%}
#ffill{background:#7bd389}#nfill{background:#ffb86b}
#speedfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 55%,transparent 0 5deg,rgba(255,255,255,.14) 5deg 6deg);-webkit-mask-image:radial-gradient(circle at 50% 55%,transparent 30%,#000 85%);mask-image:radial-gradient(circle at 50% 55%,transparent 30%,#000 85%)}
#toast{position:fixed;top:26%;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(27,18,51,.75);opacity:0;transition:opacity .3s;pointer-events:none;font-size:15px}
.ib{position:relative;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;background:rgba(27,18,51,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:10px}
#rb::after{content:attr(data-n);position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#ffb86b;color:#1b1233;font-size:11px;line-height:16px;text-align:center}

#mute.off::after{content:'';position:absolute;width:28px;height:2px;background:var(--ink);transform:rotate(-45deg)}
#nb{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:78px;height:78px;border-radius:50%;padding:0;border:0;display:grid;place-items:center;background:conic-gradient(#ffb86b var(--p,360deg),rgba(246,231,216,.25) 0)}
#nb::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#2a1a4a}
#nb svg{position:relative;width:34px;height:34px;fill:#ffb86b}
#nb:active{transform:scale(.94)}
.fuelrow{display:flex;align-items:center;gap:8px;margin-top:8px}.fuelrow svg{width:20px;height:20px;fill:none;stroke:#7bd389;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.fuelrow.low svg{stroke:#ff5a5a}.fuelrow .bar{width:84px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-radius:16px;background:rgba(27,18,51,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(246,231,216,.12)}
#hud .row{display:flex;align-items:center;gap:8px;min-height:20px}
#hud b{font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;fill:none;stroke:#ffc83d;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#lv{gap:4px}.h{width:17px;height:17px;fill:none;stroke:#ff6b81;stroke-width:1.8;stroke-linejoin:round}.h.on{fill:#ff3b5c}
#spd{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:baseline;gap:6px;text-shadow:0 1px 8px rgba(0,0,0,.5)}#spd b{font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}#spd span{font-size:13px;opacity:.7}
.card{padding:28px 30px;border-radius:22px;background:rgba(27,18,51,.62);border:1px solid rgba(246,231,216,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(330px,86vw)}
h1{font-size:38px}#go{background:#ffb86b;color:#1b1233;border:0;font-weight:600;padding:13px 36px;margin-top:4px}
#cut i{position:fixed;left:0;right:0;height:11vh;background:#000;transition:transform .6s;z-index:5;pointer-events:none}#cut i:first-child{top:0;transform:translateY(-100%)}#cut i:last-child{bottom:0;transform:translateY(100%)}#cut.on i{transform:none}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:20;padding:10px 12px;border-radius:10px;background:rgba(120,20,30,.92);color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:35vh;overflow:auto;user-select:text;-webkit-user-select:text}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="row"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.7 1.7 0 0 1 0 3.4h-3a1.7 1.7 0 0 0 0 3.4h4"/></svg><b id="d">0</b></div><div class="row" id="lv"></div><div class="row fuelrow" id="fuelrow"><svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><rect x="6" y="6" width="6" height="4"/></svg><div class="bar"><i id="ffill"></i></div></div></div>
<div id="spd"><b id="kmh">0</b><span>km/h</span></div>
</div>
<div id="tools"><button class="ib" id="rb" aria-label="Radio" hidden><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button><button class="ib" id="vb" aria-label="Camera view" hidden><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button class="ib" id="mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button></div>
<div id="over"><div class="card"><h1 id="t">Night Drive</h1><p id="s">Cruise from dusk into the night. Steer with ← → or tap the sides. Collect coins for points and hearts for extra lives. You have 3 lives. Low on fuel? The car pulls into the pit stop by itself.</p><button id="go">Start driving</button></div></div>
<button id="nb" aria-label="Boost" hidden><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2-.5-3 0-6 1-8z"/></svg></button><div id="speedfx"></div><div id="cut"><i></i><i></i></div><div id="toast"></div>
<div id="err" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Error reporter ===== */
window.addEventListener('error',e=>{const b=document.getElementById('err');if(b){b.hidden=false;b.textContent='Error: '+(e.message||e)+(e.lineno?' (line '+e.lineno+')':'')}});
/* ===== Setup ===== */
const $=id=>document.getElementById(id),cv=$('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,.1,260);S.add(cam);
S.background=new THREE.Color(0x3a2250);S.fog=new THREE.Fog(0x4a2a5a,30,150);
function fit(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
const hemi=new THREE.HemisphereLight(0xffc89a,0x2a1a4a,1),sun=new THREE.DirectionalLight(0xffa86b,.8);sun.position.set(-8,10,-12);S.add(hemi,sun);
const M=c=>new THREE.MeshLambertMaterial({color:c}),B=c=>new THREE.MeshBasicMaterial({color:c});
// reflection environment so glossy paint and glass pick up the sunset
try{const pm=new THREE.PMREMGenerator(R),es=new THREE.Scene(),g=new THREE.SphereGeometry(50,24,16),p=g.attributes.position,col=[],c1=new THREE.Color(0xff9a5a),c2=new THREE.Color(0x2a1f5a),c3=new THREE.Color(0x15151f),t=new THREE.Color();
 for(let i=0;i<p.count;i++){const y=p.getY(i)/50;if(y>=0)t.copy(c1).lerp(c2,Math.min(1,y*1.6));else t.copy(c3);col.push(t.r,t.g,t.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 const sm=new THREE.Mesh(new THREE.SphereGeometry(7,12,8),B(0xfff0c8));sm.position.set(-25,10,-38);es.add(sm);
 const panel=(w,h,x,y,z,c,rx,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(3),side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.set(rx,ry,0);es.add(m)};
 panel(40,12,0,35,0,0xffffff,Math.PI/2,0);panel(8,30,-35,12,0,0xfff0d8,0,Math.PI/2);panel(8,30,35,12,0,0xdfe8ff,0,Math.PI/2);panel(30,6,0,10,-40,0xffc890,0,0);
 S.environment=pm.fromScene(es).texture;pm.dispose()}catch(e){}

/* ===== Road: curves and hills as functions of distance ===== */
let D=0;
const C=d=>Math.sin(d*.006)*18+Math.sin(d*.0017+1)*45,H=d=>Math.sin(d*.004)*3+Math.sin(d*.0011+2)*6,cx=s=>C(D+s)-C(D),cy=s=>H(D+s)-H(D);
function place(o,s,lat){o.rotation.order='YXZ';const x=cx(s),y=cy(s),tx=cx(s+1)-x,ty=cy(s+1)-y;o.position.set(x+lat,y,-s);o.rotation.y=-Math.atan2(tx,1);o.rotation.x=Math.atan2(ty,1)}
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
let asphalt;try{asphalt=tex(128,256,g=>{g.fillStyle='#34343f';g.fillRect(0,0,128,256);
 for(let i=0;i<2600;i++){const v=40+Math.random()*34|0;g.fillStyle='rgb('+v+','+v+','+(v+8)+')';g.fillRect(Math.random()*128,Math.random()*256,1.6,1.6)}
 g.fillStyle='#e8e2d0';g.fillRect(4,0,4,256);g.fillRect(120,0,4,256);g.fillStyle='#d9d3c0';for(const x of[42,85])g.fillRect(x-2,0,4,96)})}catch(e){asphalt=null}
const roadMat=new THREE.MeshStandardMaterial({map:asphalt,roughness:.85,metalness:0}),grassMat=new THREE.MeshLambertMaterial({vertexColors:true});
const tc2=new THREE.Color(),ZB=[0,1400,2600,3050,4450,5850],ZT=5850,ZN=['Countryside','Town','Tunnel','Seaside','Desert'];
const ZC=[0x3f7a3a,0x3b3b48,0x2a2a30,0xd9c08a,0xc09a5a].map(c=>new THREE.Color(c));
function zoneAt(d){d=((d%ZT)+ZT)%ZT;for(let i=1;i<6;i++)if(d<ZB[i])return i-1;return 4}
function landCol(s,o){const d=D+s,m=((d%ZT)+ZT)%ZT,z=zoneAt(d),e=ZB[z+1]-m;o.copy(ZC[z]);if(e<100)o.lerp(ZC[(z+1)%5],1-e/100)}
const seaA=new THREE.Color(0x1f6f9a),seaB=new THREE.Color(0x4aa8c8),seaC=new THREE.Color();
function seaCol(s,o){const d=D+s,m=((d%ZT)+ZT)%ZT;landCol(s,o);if(zoneAt(d)==3){const a=Math.max(0,Math.min(1,(m-ZB[3])/100,(ZB[4]-m)/100));seaC.copy(seaA).lerp(seaB,.5+.5*Math.sin(d*.05+tq*1.4));o.lerp(seaC,a)}}
function strip(w,mat,lift,vc,off){const N=60,g=new THREE.BufferGeometry(),idx=[],nr=[];
 for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}for(let i=0;i<(N+1)*2;i++)nr.push(0,1,0);
 g.setAttribute('position',new THREE.BufferAttribute(new Float32Array((N+1)*6),3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nr,3));
 g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array((N+1)*4),2));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array((N+1)*6).fill(1),3));g.setIndex(idx);
 const m=new THREE.Mesh(g,mat);m.frustumCulled=false;S.add(m);
 return()=>{const p=g.attributes.position,u=g.attributes.uv,k=g.attributes.color;for(let i=0;i<=N;i++){const s=-10+i*4,x=cx(s),y=cy(s)+lift,v=(D+s)/8;
  p.setXYZ(i*2,x+(off||0)-w/2,y,-s);p.setXYZ(i*2+1,x+(off||0)+w/2,y,-s);u.setXY(i*2,0,v);u.setXY(i*2+1,1,v);
  if(vc){vc(s,tc2);k.setXYZ(i*2,tc2.r,tc2.g,tc2.b);k.setXYZ(i*2+1,tc2.r,tc2.g,tc2.b)}}
  p.needsUpdate=u.needsUpdate=true;if(vc)k.needsUpdate=true}}
const waterMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9,metalness:.1});
const upRoad=strip(9,roadMat,0),upGL=strip(18,grassMat,-.08,landCol,-13.5),upGR=strip(150,grassMat,-.08,landCol,79.5),upSea=strip(140,waterMat,-.12,seaCol,-92);
const under=new THREE.Mesh(new THREE.PlaneGeometry(700,700),M(0x1c2e2e));under.rotation.x=-Math.PI/2;under.position.y=-14;S.add(under);

/* ===== Roadside: lamp posts, zone scenery, tunnel ===== */
const PER=216,poles=[];
for(let i=0;i<18;i++)for(const l of[-6,6]){const g=new THREE.Group(),p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,5),M(0x555566)),b=new THREE.Mesh(new THREE.SphereGeometry(.25),B(0xffc27a));p.position.y=2.5;b.position.y=5;g.add(p,b);S.add(g);poles.push({m:g,k:i*12,l})}
function at(o,x,y,z){o.position.set(x,y,z);return o}
const trunkG=new THREE.CylinderGeometry(.25,.32,1.6),PG=[new THREE.ConeGeometry(1.8,2.6,8),new THREE.ConeGeometry(1.45,2.3,8),new THREE.ConeGeometry(1.05,2,8)],cacG=new THREE.CylinderGeometry(.35,.4,3,8),armG=new THREE.CylinderGeometry(.18,.18,1,8),rockG=new THREE.DodecahedronGeometry(1.1),boxG=new THREE.BoxGeometry(1,1,1),
 oakG=new THREE.IcosahedronGeometry(1.8,1),baleG=new THREE.CylinderGeometry(.9,.9,1.2,12),roofG=new THREE.ConeGeometry(4.3,2.2,4),pyrG=new THREE.ConeGeometry(2.6,1.3,4),capG=new THREE.ConeGeometry(1.5,1.4,10),lhG=new THREE.CylinderGeometry(.9,1.25,14,14),bandG=new THREE.CylinderGeometry(.97,1.1,2,14),palmTG=new THREE.CylinderGeometry(.14,.26,5.5,8);
const pineM=new THREE.MeshLambertMaterial({color:0x1f5a3a,flatShading:true}),trunkM=M(0x4a3022),cacM=M(0x4a7a3a),rockM=new THREE.MeshLambertMaterial({color:0x6a5a55,flatShading:true}),oakM=new THREE.MeshLambertMaterial({color:0x3f8a3a,flatShading:true}),baleM=M(0xd8b45a),barnM=M(0x9a2f2f),roofM=M(0x4a3030),mesaM=M(0xb8693a),whiteM=M(0xf0e6d0),redM=M(0xd23a3a),palmM=new THREE.MeshLambertMaterial({color:0x3f8a4a,flatShading:true}),hutRoofM=M(0x2a8a8a);
const winTex=tex(64,128,g=>{g.fillStyle='#2a2a34';g.fillRect(0,0,64,128);for(let i=0;i<8;i++)for(let j=0;j<16;j++)if(Math.random()<.55){g.fillStyle='#ffd98a';g.fillRect(i*8+2,j*8+2,4,5)}});
const bMats=[0x8a8a99,0xb08a70,0x7a8aa0].map(c=>new THREE.MeshLambertMaterial({color:c,map:winTex,emissive:0xffffff,emissiveMap:winTex,emissiveIntensity:.2})),bMat=bMats[0];
const bld=k=>()=>{const h=8+Math.random()*16,w=4+Math.random()*3,g=new THREE.Group(),b=at(new THREE.Mesh(boxG,bMats[k]),0,h/2,0),rf=at(new THREE.Mesh(boxG,rockM),0,h+.15,0);b.scale.set(w,h,w);rf.scale.set(w+.3,.3,w+.3);g.add(b,rf);return g};
const BUILD={
 oak:()=>{const g=new THREE.Group(),c2=at(new THREE.Mesh(oakG,oakM),.9,2.6,.4);c2.scale.setScalar(.7);g.add(at(new THREE.Mesh(trunkG,trunkM),0,.8,0),at(new THREE.Mesh(oakG,oakM),0,3.2,0),c2);return g},
 pine:()=>{const g=new THREE.Group();g.add(at(new THREE.Mesh(trunkG,trunkM),0,.8,0));PG.forEach((q,j)=>g.add(at(new THREE.Mesh(q,pineM),0,[2.5,3.6,4.6][j],0)));return g},
 bale:()=>{const m=at(new THREE.Mesh(baleG,baleM),0,.6,0),g=new THREE.Group();m.rotation.z=Math.PI/2;g.add(m);return g},
 barn:()=>{const g=new THREE.Group(),b=at(new THREE.Mesh(boxG,barnM),0,1.8,0),r=at(new THREE.Mesh(roofG,roofM),0,4.4,0);b.scale.set(5,3.6,7);r.rotation.y=Math.PI/4;r.scale.set(1,.9,1.3);g.add(b,r);return g},
 bldgA:bld(0),bldgB:bld(1),bldgC:bld(2),
 palm:()=>{const g=new THREE.Group();g.add(at(new THREE.Mesh(palmTG,trunkM),0,2.75,0));for(let k=0;k<6;k++){const p=new THREE.Group(),f=at(new THREE.Mesh(boxG,palmM),1.2,0,0);f.scale.set(2.4,.06,.55);f.rotation.z=-.35;p.add(f);p.position.y=5.5;p.rotation.y=k*1.047;g.add(p)}return g},
 hut:()=>{const g=new THREE.Group(),b=at(new THREE.Mesh(boxG,whiteM),0,1.2,0),r=at(new THREE.Mesh(pyrG,hutRoofM),0,3,0);b.scale.set(3,2.4,3);r.rotation.y=Math.PI/4;g.add(b,r);return g},
 lighthouse:()=>{const g=new THREE.Group(),lamp=at(new THREE.Mesh(boxG,B(0xfff0a0)),0,14.6,0);lamp.scale.set(1.8,1.2,1.8);g.add(at(new THREE.Mesh(lhG,whiteM),0,7,0),at(new THREE.Mesh(bandG,redM),0,4,0),at(new THREE.Mesh(bandG,redM),0,9.5,0),lamp,at(new THREE.Mesh(capG,redM),0,16,0));return g},
 cactus:()=>{const g=new THREE.Group(),a=at(new THREE.Mesh(armG,cacM),.3,1.3,0);a.scale.y=.6;a.rotation.z=Math.PI/2;g.add(at(new THREE.Mesh(cacG,cacM),0,1.5,0),at(new THREE.Mesh(armG,cacM),.6,1.8,0),a);return g},
 rock:()=>{const g=new THREE.Group(),r=at(new THREE.Mesh(rockG,rockM),0,.5,0);r.scale.set(1,.6,1);g.add(r);return g},
 mesa:()=>{const g=new THREE.Group(),b=at(new THREE.Mesh(boxG,mesaM),0,3,0),c=at(new THREE.Mesh(boxG,M(0xd9925a)),0,4.2,0);b.scale.set(14,6,10);c.scale.set(14.2,.8,10.2);g.add(b,c);return g}};
function pick(z,o){const r=o.r;if(z==0)return r<.4?'oak':r<.65?'pine':r<.8?'bale':'barn';if(z==1)return['bldgA','bldgB','bldgC'][o.n];if(z==3)return r<.5?'palm':r<.72?'rock':r<.9?'hut':(o.side>0?'lighthouse':'palm');if(z==4)return r<.5?'cactus':r<.8?'rock':'mesa';return null}
function latOf(z,key,o){if(z==1)return o.side*(9+o.r*4);if(key==='mesa')return o.side*(26+o.r*30);if(key==='lighthouse')return 16+o.r*8;if(z==3&&o.side<0)return -(8+o.r*9);return o.side*(8+o.r*(z==4?22:16))}
const slots=[];for(let i=0;i<20;i++)for(const side of[-1,1]){const g=new THREE.Group();S.add(g);slots.push({g,v:{},k:i*14,side,r:Math.random(),n:Math.random()*3|0,sc:.8+Math.random()*.6,cur:null})}
